[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "be"
version = "0.1.0"
description = "Personal workflow CLI and local web app"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "cryptography>=42",
    "fastapi>=0.115",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
backup = [
    "boto3>=1.34",
    "google-cloud-storage>=2.10",
]
dns = [
    "boto3>=1.34",
    "requests>=2.31",
]
kube = [
    "kubernetes>=31.0",
    "rich>=13",
]
test = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
be = "be.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/be"]
# the web app's build output is gitignored, which hatch would otherwise leave out
artifacts = ["src/be/server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette's TestClient asks for httpx2 now, but httpx still works
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
